<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" fill="none" role="img" aria-label="">
<title></title>
<style>
.pl { animation: travel 4.5s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes travel { from { transform: translateX(0); } to { transform: translateX(1500px); } }
.gem { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
@keyframes spin { from { transform: rotate(45deg); } to { transform: rotate(405deg); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
<linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#a371f7" stop-opacity="0"/><stop offset=".25" stop-color="#a371f7"/><stop offset=".5" stop-color="#22d3ee"/><stop offset=".75" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
</linearGradient>
<linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<filter id="blur" x="-50%" y="-400%" width="200%" height="900%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect y="11.25" width="1200" height="1.5" fill="url(#dv)" opacity=".7"/>
<rect class="pl" x="-200" y="10" width="160" height="4" rx="2" fill="url(#pulse)" filter="url(#blur)"/>
<rect class="pl" x="-200" y="11.25" width="160" height="1.5" fill="url(#pulse)"/>
<rect x="594.0" y="6" width="12" height="12" transform="rotate(45 600.0 12)" fill="#06060c"/>
<rect class="gem" x="595.0" y="7" width="10" height="10" fill="#06060c" stroke="#22d3ee" stroke-width="1.5" style="transform: rotate(45deg)"/>
</svg>
